<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word Cloud Survey</title>
<style>
  :root{--purple:#6a1b9a;--green:#2e7d32;--gold:#c0a000;--ink:#1b1b1b;--bg:#fffdf7;--muted:#f3efe2}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:contain}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .mask{width:40px;height:40px;border-radius:8px;background:
    radial-gradient(circle at 30% 30%,#fff 0 12px,transparent 12px),
    linear-gradient(135deg,var(--purple),var(--green),var(--gold));
    box-shadow:0 2px 8px rgba(0,0,0,.15)}
  h1{font-size:1.25rem;margin:0}
  .card{background:#fff;border:1px solid #eadfbf;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.06);overflow:hidden}
  .hero{padding:18px;background:
    repeating-linear-gradient(135deg,rgba(106,27,154,.10),rgba(106,27,154,.10) 8px,transparent 8px,transparent 16px),
    linear-gradient(135deg,rgba(46,125,50,.08),rgba(192,160,0,.08));border-bottom:1px solid #eadfbf}
  .hero h2{margin:.1rem 0 .35rem 0;font-size:1.1rem}
  .small{font-size:.92rem;color:#333}
  .body{padding:18px}
  .progress{height:8px;background:var(--muted);border-radius:999px;overflow:hidden;margin:8px 0 14px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--green),var(--gold))}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  input[type="text"],input[type="number"]{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd}
  .choices{display:grid;gap:10px;margin-top:8px}
  .choice{border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;cursor:pointer}
  .choice:hover{border-color:#c9b98a;background:#fffdf2}
  .choice-media{align-items:center}
  .choice-thumb{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid #eadfbf;flex:0 0 auto}
  .controls{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--purple);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  button.secondary{background:#eee;color:#222}
  button.outline{background:#fff;border:1px solid #c9b98a;color:#222}
  button:disabled{opacity:.55;cursor:not-allowed}
  .tag{padding:6px 10px;border-radius:999px;font-size:.9rem;border:1px solid #eadfbf;background:#fff;display:inline-block;margin-right:8px}
  .center{text-align:center}
  details summary{cursor:pointer}
  .slide-banner{width:min(100%,540px);aspect-ratio:32/27;margin:0 auto 10px;border-radius:12px;background-color:#000;background-size:contain;background-repeat:no-repeat;background-position:center center;border:1px solid #eadfbf}
  .feedback-banner{margin-top:10px;padding:14px 16px;border-radius:14px;border:2px solid;font-size:1.05rem;font-weight:800;line-height:1.35;letter-spacing:.2px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .feedback-banner .label{display:block;font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
  .feedback-correct{color:#fff;background:linear-gradient(135deg,var(--green),var(--purple));border-color:var(--green)}
  .feedback-wrong{color:#fff;background:linear-gradient(135deg,var(--purple),var(--gold));border-color:var(--gold)}
  .answer-fact-card{margin-top:10px;padding:12px 14px;border-radius:12px;border:1px solid #eadfbf;background:#fff;color:#111;font-weight:400}
  .synced-score-callout{width:100%;box-sizing:border-box;margin-top:8px;padding:12px 14px;border-radius:12px;border:1px solid #000;background:#1b1b1b;color:#fff;font-size:1rem;font-weight:800;letter-spacing:.2px;box-shadow:0 4px 10px rgba(0,0,0,.24)}
  .synced-score-label{font-weight:900;text-transform:uppercase;font-size:.78rem;letter-spacing:.8px;margin-right:8px;color:#fff}
  .synced-correct{color:#58d68d}
  .synced-incorrect{color:#ff6b6b}
  .synced-value-correct{color:#7dff9f;font-weight:900;font-size:1.08rem}
  .synced-value-incorrect{color:#ff7d7d;font-weight:900;font-size:1.08rem}
  .presentation-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.2fr);gap:10px;align-items:start}
  .presentation-panel{background:#fff;border:1px solid #eadfbf;border-radius:12px;padding:14px}
  .presentation-panel .qtext{font-size:1.35rem;line-height:1.35}
  .presentation-panel .small{font-size:1rem}
  .presentation-panel ol.small li{font-size:1.03rem;line-height:1.45;margin-bottom:4px}
  .presentation-pie{width:160px;height:160px;border-radius:50%;border:1px solid #eadfbf;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:#222;flex-shrink:0}
  .presentation-bottom-row{display:flex;gap:12px;align-items:center;margin-top:10px}
  .presentation-bottom-row .synced-score-callout{flex:1;margin:0}
  .presentation-pie-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;transform:translateY(-40%)}
  .presentation-legend{display:grid;gap:6px;margin-top:8px;min-width:160px}
  .presentation-legend .item{display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
  .presentation-legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
  /* projector-safe viewport fit */
  body.presentation-active{overflow:hidden}
  body.presentation-active .wrap{max-width:100%;padding:4px 10px 2px;display:flex;flex-direction:column;height:100vh;height:100dvh;box-sizing:border-box}
  body.presentation-active header{flex-shrink:0;margin-bottom:2px}
  body.presentation-active .card{flex:1;overflow:hidden;min-height:0;border-radius:8px;display:flex;flex-direction:column}
  body.presentation-active .hero{flex-shrink:0;padding:8px 12px}
  body.presentation-active .body{flex:1;overflow:hidden;min-height:0;padding:8px 10px}
  body.presentation-active .presentation-grid{height:100%;align-items:stretch}
  body.presentation-active .presentation-panel{height:100%;box-sizing:border-box;overflow-y:auto}
  body.presentation-active .slide-banner{height:clamp(120px,22vh,170px);width:100%;aspect-ratio:unset}
  body.presentation-active .wrap > p.small{display:none}
  @media (max-width:760px){.presentation-grid{grid-template-columns:1fr}}
  @media (max-height:760px){
    body.presentation-active .presentation-panel .qtext{font-size:1.15rem}
    body.presentation-active .presentation-panel .small{font-size:.92rem}
    body.presentation-active .presentation-panel ol.small li{font-size:.94rem;line-height:1.35}
    body.presentation-active .presentation-pie{width:140px;height:140px;font-size:.95rem}
    body.presentation-active .presentation-bottom-row{gap:8px;margin-top:8px}
  }
  @media (max-width:480px){.slide-banner{width:min(92vw,400px)}}
  @keyframes scroll-text { from{transform:translateX(100%)} to{transform:translateX(-100%)} }
  .ticker-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; overflow:hidden }
  .ticker-name { font-weight:700; min-width:80px; flex-shrink:0; font-size:.9rem; white-space:nowrap }
  .ticker-track { overflow:hidden; white-space:nowrap; flex:1 }
  .ticker-text { display:inline-block; animation: scroll-text linear infinite }
  .wordcloud-wrap { width:100%; display:flex; align-items:center; justify-content:center; margin-top:12px }
  .wordcloud-wrap canvas { max-width:100%; border-radius:12px; background:#fafafa }
</style>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>

<body>
<div class="wrap">
  <header><div class="mask" aria-hidden="true"></div><h1>Team Health Word Cloud</h1></header>
  <div class="card">
    <div class="hero">
      <h2 id="title">Share your perspective</h2>
      <div class="progress" aria-label="Progress"><div class="bar" id="bar"></div></div>
      <div><span class="tag" id="tagQ">Q: 0/10</span><span class="tag" id="tagScore">Score: 0</span></div>
    </div>
    <div class="body" id="screen"></div>
  </div>
  <p class="small" style="margin-top:12px">Tip: Works great on phones. If anything looks cached, pull-to-refresh.</p>
</div>

<script>
/*** ====== SURVEY DATA ====== ***/
const QUESTIONS = [
  { text: "What behaviors or practices reduce trust in your team?" },
  { text: "What behaviors or practices reduce resilience during change?" }
];



let score = 0;
let answered = []; // selected option indexes (absolute index across all rounds)
let nameVal = "", aliasVal = "";
let resultsFormUrl = ""; // optional: paste a Microsoft Form (Anyone can respond) link if you want
let sessionMode = 'participant'; // presenter | participant
let sharedState = null;
let firebaseApp = null;
let firebaseDb = null;
let firebaseFns = null;
let firebaseSessionRoot = null;
let firebaseStateRef = null;
let firebaseResultsRef = null;
let firebaseStateUnsub = null;
let firebaseResultsUnsub = null;
let landingPresenterStateUnsub = null;
let landingPresenterSnapshot = {};
let landingPresenterActive = null;
let landingPresentationActive = null;
let realtimeTransport = 'offline';
let sharedStateObserverUnsub = null;
let presenterToken = '';
let presenterHeartbeatTimer = null;
let presentationToken = '';
let presentationHeartbeatTimer = null;
let participantId = '';
let participantFeedback = {};
let lastRemoteCurrent = -1;
let lastRemoteEnded = false;
let lastRemotePhase = '';
let realtimeEnabled = true;
let isPresentationReady = false;
const SESSION_STORAGE_KEY = 'mardi-gras-quiz-session-v1';
const PUBLIC_ROOM_ID = 'mardi-gras-public-session';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBoaFArhEidJBLEEUFGqe3a0X3jOc-7UZQ",
  authDomain: "webquiz-26c83.firebaseapp.com",
  databaseURL: "https://webquiz-26c83-default-rtdb.firebaseio.com",
  projectId: "webquiz-26c83",
  storageBucket: "webquiz-26c83.firebasestorage.app",
  messagingSenderId: "636029354938",
  appId: "1:636029354938:web:5b403935e21e4abe5d5383",
  measurementId: "G-Z83N35PWKW"
};





// UI
const screen = document.getElementById('screen');
const bar = document.getElementById('bar');
const tagQ = document.getElementById('tagQ');
const tagScore = document.getElementById('tagScore');

function saveSessionState(){
  try{
    const payload = {
      nameVal,
      aliasVal,
      sessionMode,
      phase,
      current,
      score,
      answered,
      participantFeedback,
      participantId,
      savedAt: Date.now()
    };
    sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(payload));
  }catch(e){}
}
function clearSessionState(){
  try{ sessionStorage.removeItem(SESSION_STORAGE_KEY); }catch(e){}
}
function restoreSessionState(){
  try{
    const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
    if(!raw) return false;
    const state = JSON.parse(raw);
    if(!state || typeof state !== 'object') return false;
    if(!state.nameVal || typeof state.nameVal !== 'string') return false;
    /* Always go back to landing for presenter — token must be re-claimed */
    if(state.sessionMode === 'presenter') return false;

    nameVal = state.nameVal;
    aliasVal = typeof state.aliasVal === 'string' ? state.aliasVal : '';
    if(state.sessionMode === 'presenter' || state.sessionMode === 'participant' || state.sessionMode === 'presentation'){
      sessionMode = state.sessionMode;
    } else {
      sessionMode = 'participant';
    }
    phase = typeof state.phase === 'string' ? state.phase : PHASE_ROUND1;
    current = typeof state.current === 'number' ? state.current : 0;
    score = typeof state.score === 'number' ? state.score : 0;
    answered = Array.isArray(state.answered) ? state.answered : [];
    participantFeedback = state.participantFeedback && typeof state.participantFeedback === 'object' ? state.participantFeedback : {};
    participantId = (typeof state.participantId === 'string' && state.participantId) ? state.participantId : `${Date.now()}-${Math.random().toString(36).slice(2)}`;

    if(phase === PHASE_FINAL){
      if(sessionMode === 'presentation'){
        renderPresentationView(current, true);
        return true;
      }
      renderEnd();
      return true;
    }
    if(current < 0 || current >= ROUND1_COUNT) current = 0;
    if(sessionMode === 'presentation'){
      renderPresentationView(current);
      return true;
    }
    renderQuestion(current);
    return true;
  }catch(e){
    return false;
  }
}
async function resumeRealtimeAfterRestore(){
  if((sessionMode !== 'participant' && sessionMode !== 'presentation') || !nameVal) return;
  const restoredPhase = phase;
  const restoredCurrent = current;
  const ok = await initRealtime();
  realtimeEnabled = ok;
  if(!ok || !sharedState) return;

  lastRemoteCurrent = -1;
  lastRemoteEnded = sharedState.get('ended') === true;
  lastRemotePhase = '';

  if(hasActivePresenter()){
    if(sessionMode === 'participant') applyParticipantState();
    else applyPresentationState();
    return;
  }

  if(restoredPhase === PHASE_FINAL){
    if(sessionMode === 'presentation') renderPresentationView(restoredCurrent, true);
    else renderEnd();
    return;
  }
  if(restoredCurrent >= 0 && restoredCurrent < ROUND1_COUNT){
    if(sessionMode === 'presentation') renderPresentationView(restoredCurrent);
    else renderQuestion(restoredCurrent);
  }
}

/*** ====== HELPERS ====== ***/
function modeText(){
  if(!realtimeEnabled) return 'Offline mode (local quiz only)';
  if(sessionMode === 'presenter') return `Presenter mode (controls progression) • Sync: ${realtimeTransport}`;
  if(sessionMode === 'presentation') return `Presentation view • Sync: ${realtimeTransport}`;
  return `Participant mode (follows presenter) • Sync: ${realtimeTransport}`;
}
function setPresentationShell(enabled){
  const wrap = document.querySelector('.wrap');
  if(!wrap) return;
  wrap.style.maxWidth = enabled ? '100%' : '760px';
  if(enabled) document.body.classList.add('presentation-active');
  else document.body.classList.remove('presentation-active');
}
function isQuestionPhase(){
  return phase === PHASE_ROUND1;
}
function renderBanner(index = 0){
  return '';
}
function updateHeader(){
  const idx = Math.max(0,current+1);
  let pct = 0;
  if(phase === PHASE_ROUND1){
    pct = current < 0 ? 0 : Math.round(((idx)/total)*100);
    if(sessionMode === 'presentation'){
      tagQ.textContent = current < 0 ? `Display • Q 0/${ROUND1_COUNT}` : `Display • Q ${current+1}/${ROUND1_COUNT}`;
    } else {
      tagQ.textContent = current < 0 ? `Q 0/${ROUND1_COUNT}` : `Q ${current+1}/${ROUND1_COUNT}`;
    }
  } else {
    pct = 100;
    tagQ.textContent = sessionMode === 'presentation' ? 'Display • Final Standings' : 'Final Standings';
  }
  bar.style.width = pct + '%';
  if(sessionMode === 'presenter' || sessionMode === 'presentation'){
    tagScore.style.display = 'none';
  } else {
    tagScore.style.display = 'inline-block';
    tagScore.textContent = `Responses: ${score}/${total}`;
  }
}
function shouldShowSyncedQuestionStats(){
  return isQuestionPhase() && realtimeEnabled && !!sharedState;
}
function syncedQuestionStatsLabel(index){
  const stats = getSyncedQuestionStats(index);
  return `<span class="synced-score-label">Submitted: <strong>${stats.submitted}</strong></span>`;
}
function updateSyncedQuestionStatsUI(){
  const el = document.getElementById('syncedQuestionStats');
  if(!el) return;
  if(!shouldShowSyncedQuestionStats()){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = syncedQuestionStatsLabel(current);
}
function destroyRealtime(){
  if(presenterHeartbeatTimer){ clearInterval(presenterHeartbeatTimer); presenterHeartbeatTimer = null; }
  if(presentationHeartbeatTimer){ clearInterval(presentationHeartbeatTimer); presentationHeartbeatTimer = null; }
  if(sharedStateObserverUnsub){ sharedStateObserverUnsub(); sharedStateObserverUnsub = null; }
  if(sharedState && sessionMode === 'presenter' && presenterToken && sharedState.get('presenterToken') === presenterToken){
    sharedState.delete('presenterToken');
    sharedState.delete('presenterName');
    sharedState.set('presenterHeartbeat', 0);
  }
  if(sharedState && sessionMode === 'presentation' && presentationToken && sharedState.get('presentationToken') === presentationToken){
    sharedState.delete('presentationToken');
    sharedState.delete('presentationName');
    sharedState.set('presentationHeartbeat', 0);
  }
  presenterToken = '';
  presentationToken = '';
  isPresentationReady = false;
  if(firebaseStateUnsub){ firebaseStateUnsub(); firebaseStateUnsub = null; }
  if(firebaseResultsUnsub){ firebaseResultsUnsub(); firebaseResultsUnsub = null; }
  firebaseSessionRoot = null;
  firebaseStateRef = null;
  firebaseResultsRef = null;
  sharedState = null;
  realtimeTransport = 'offline';
}
function stopLandingPresenterWatch(){
  if(landingPresenterStateUnsub){
    landingPresenterStateUnsub();
    landingPresenterStateUnsub = null;
  }
  landingPresenterSnapshot = {};
  landingPresenterActive = null;
  landingPresentationActive = null;
}
function applyLandingPresenterAvailability(){
  const modeIn = document.getElementById('modeIn');
  if(!modeIn) return;
  const presenterOption = modeIn.querySelector('option[value="presenter"]');
  const participantOption = modeIn.querySelector('option[value="participant"]');
  const presentationOption = modeIn.querySelector('option[value="presentation"]');
  if(!presenterOption) return;
  const presenterHeartbeat = landingPresenterSnapshot.presenterHeartbeat || 0;
  const presenterActive = !!landingPresenterSnapshot.presenterToken && (Date.now() - presenterHeartbeat) < 10000;
  const presentationHeartbeat = landingPresenterSnapshot.presentationHeartbeat || 0;
  const presentationActive = !!landingPresenterSnapshot.presentationToken && (Date.now() - presentationHeartbeat) < 10000;
  if(landingPresenterActive !== presenterActive){
    landingPresenterActive = presenterActive;
    presenterOption.disabled = presenterActive;
    presenterOption.textContent = presenterActive
    ? 'Presenter (controls everyone) — unavailable'
    : 'Presenter (controls everyone)';
    if(presenterActive && modeIn.value === 'presenter') modeIn.value = 'participant';
  }
  if(participantOption){
    participantOption.disabled = false;
    participantOption.textContent = 'Participant (follows presenter)';
  }
  if(presentationOption && landingPresentationActive !== presentationActive){
    landingPresentationActive = presentationActive;
    presentationOption.hidden = presentationActive;
    if(presentationActive && modeIn.value === 'presentation') modeIn.value = 'participant';
  }
  updateForceResetAvailability();
  handleLandingModeChange();
}
function updateForceResetAvailability(){
  const resetBtn = document.getElementById('forceResetBtn');
  const modeIn = document.getElementById('modeIn');
  if(!resetBtn) return;
  const presenterOption = modeIn ? modeIn.querySelector('option[value="presenter"]') : null;
  const presentationOption = modeIn ? modeIn.querySelector('option[value="presentation"]') : null;
  const presenterAvailable = !!presenterOption && !presenterOption.disabled;
  const presentationAvailable = !!presentationOption && !presentationOption.hidden && !presentationOption.disabled;
  const disabled = !(presenterAvailable || presentationAvailable);
  resetBtn.disabled = disabled;
  resetBtn.title = disabled
    ? 'Force Reset is disabled when only Participant mode is available.'
    : 'Clear all Firebase session data and start fresh';
}
function handleLandingModeChange(){
  const modeIn = document.getElementById('modeIn');
  const nameIn = document.getElementById('nameIn');
  const nameHint = document.getElementById('nameHint');
  if(!modeIn || !nameIn || !nameHint) return;
  const requiresName = modeIn.value === 'participant';
  if(!requiresName){
    nameIn.value = '';
    nameIn.disabled = true;
    nameIn.placeholder = 'No name needed for this mode';
    nameHint.textContent = 'Name is only used for Participant mode.';
  } else {
    nameIn.disabled = false;
    nameIn.placeholder = 'Your Name or Alias (required)';
    nameHint.textContent = 'Name or Alias';
  }
  updateForceResetAvailability();
}
async function startLandingPresenterWatch(){
  stopLandingPresenterWatch();
  if(!(await loadRealtimeLibs())) return;
  const stateRef = firebaseFns.ref(firebaseDb, `sessions/${PUBLIC_ROOM_ID}/state`);
  landingPresenterStateUnsub = firebaseFns.onValue(stateRef, snap => {
    landingPresenterSnapshot = snap.val() || {};
    applyLandingPresenterAvailability();
  });
}
function createFirebaseSharedState(){
  const stateData = {};
  const resultData = {};
  const observers = new Set();
  const notify = ()=> observers.forEach(cb => { try{ cb(); }catch(err){ console.error(err); } });

  return {
    set(key, value){
      if(typeof key !== 'string') return;
      if(key.startsWith('result:')){
        const resultId = key.slice(7);
        try{
          resultData[resultId] = typeof value === 'string' ? JSON.parse(value) : value;
        }catch(e){
          resultData[resultId] = value;
        }
        if(firebaseFns && firebaseResultsRef){
          const resultRef = firebaseFns.child(firebaseResultsRef, resultId);
          firebaseFns.set(resultRef, resultData[resultId]).catch(e => console.error('Firebase write error:', e));
        }
        notify();
        return;
      }
      stateData[key] = value;
      if(firebaseFns && firebaseStateRef){
        const keyRef = firebaseFns.child(firebaseStateRef, key);
        firebaseFns.set(keyRef, value).catch(e => console.error('Firebase write error:', e));
      }
      notify();
    },
    get(key){
      if(typeof key !== 'string') return undefined;
      if(key.startsWith('result:')){
        const resultId = key.slice(7);
        const value = resultData[resultId];
        return value == null ? undefined : JSON.stringify(value);
      }
      return stateData[key];
    },
    delete(key){
      if(typeof key !== 'string') return;
      if(key.startsWith('result:')){
        const resultId = key.slice(7);
        delete resultData[resultId];
        if(firebaseFns && firebaseResultsRef){
          const resultRef = firebaseFns.child(firebaseResultsRef, resultId);
          firebaseFns.remove(resultRef).catch(e => console.error('Firebase remove error:', e));
        }
        notify();
        return;
      }
      delete stateData[key];
      if(firebaseFns && firebaseStateRef){
        const keyRef = firebaseFns.child(firebaseStateRef, key);
        firebaseFns.remove(keyRef).catch(e => console.error('Firebase remove error:', e));
      }
      notify();
    },
    forEach(cb){
      Object.entries(stateData).forEach(([k,v])=> cb(v, k));
      Object.entries(resultData).forEach(([k,v])=> cb(JSON.stringify(v), `result:${k}`));
    },
    observe(cb){
      observers.add(cb);
      return ()=> observers.delete(cb);
    },
    replaceState(next){
      Object.keys(stateData).forEach(k => delete stateData[k]);
      Object.assign(stateData, next || {});
      notify();
    },
    replaceResults(next){
      Object.keys(resultData).forEach(k => delete resultData[k]);
      Object.assign(resultData, next || {});
      notify();
    }
  };
}
function pushPresenterState(isEnded = false){
  if(sessionMode !== 'presenter' || !sharedState) return;
  if(firebaseFns && firebaseStateRef){
    const updates = {};
    updates['phase'] = phase;
    updates['current'] = current;
    updates['ended'] = isEnded;
    updates['updatedAt'] = Date.now();
    firebaseFns.update(firebaseStateRef, updates).catch(e => console.error('Firebase update error:', e));
  }
}
function publishMyTally(){
  if(sessionMode !== 'participant' || !sharedState || !participantId || !nameVal) return;
  recalcScore();
  const payload = {
    id: participantId,
    name: nameVal,
    answers: Array.from({ length: total }, (_, idx) => answered[idx] != null ? answered[idx] : null),
    rightOverall: score,
    totalOverall: total,
    mode: sessionMode,
    updatedAt: Date.now()
  };
  sharedState.set(`result:${participantId}`, JSON.stringify(payload));
}
function getSharedResults(){

    if(typeof key === 'string' && key.startsWith('result:') && typeof value === 'string'){
      try{ items.push(JSON.parse(value)); }catch(e){}
    }
  });
  return items;
}
function getSharedTallies(){

function getSyncedQuestionStats(index){

  getSharedResults().forEach((result)=>{
    const picks = Array.isArray(result.answers) ? result.answers : [];
    if(picks[index] != null) submitted++;

}

function renderResponseTickerHtml(qIndex){

  });
  if(!responses.length) return '<p class="small">No responses yet — waiting for participants…</p>';
  return responses.map(r => {
    const chars = r.name.length + r.text.length + 2;
    const dur = Math.max(8, chars * 0.07).toFixed(1);
    return `<div class="ticker-row">

        <span class="ticker-text" style="animation-duration:${dur}s">${r.text}</span>
      </div>
    </div>`;
  }).join('');
}
function buildWordFrequency(qIndex){
  const STOP_WORDS = new Set(['a','an','the','and','or','but','in','on','at','to','for','of','with','by','from','is','it','its','this','that','these','those','was','are','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','not','no','so','if','as','up','out','my','your','their','our','we','i','you','they','he','she','his','her','their','more','also','just','than','when','what','how','all','some','any','each','which']);
  const freq = {};
  getSharedResults().forEach(r => {
    const picks = Array.isArray(r.answers) ? r.answers : [];
    const text = picks[qIndex];
    if(!text || typeof text !== 'string') return;
    const words = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP_WORDS.has(w));
    words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
    for(let i = 0; i < words.length - 1; i++){
      const bigram = words[i] + ' ' + words[i+1];
      freq[bigram] = (freq[bigram] || 0) + 0.5;
    }
  });
  return Object.entries(freq).sort((a,b) => b[1]-a[1]);
}
function renderWordCloud(qIndex){
  const canvas = document.getElementById('wordCloudCanvas');
  if(!canvas || typeof WordCloud === 'undefined') return;
  const list = buildWordFrequency(qIndex);
  if(!list.length){ canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); return; }
  const maxFreq = list[0][1] || 1;
  WordCloud(canvas, {
    list,
    weightFactor: w => Math.max(14, Math.min(60, (w / maxFreq) * 60)),
    color: () => ['#6b21a8','#15803d','#b45309'][Math.floor(Math.random()*3)],
    rotateRatio: 0,
    backgroundColor: '#fafafa',
    gridSize: 8,
    minSize: 10
  });
}

function applyParticipantState(){
  if(sessionMode !== 'participant' || !sharedState) return;
  if(!hasActivePresenter()) return;
  const remotePhase = sharedState.get('phase') || PHASE_ROUND1;
  const ended = sharedState.get('ended') === true;
  const remoteCurrent = sharedState.get('current');
  if(ended && !lastRemoteEnded){
    lastRemoteEnded = true;
    phase = PHASE_FINAL;
    renderEnd();
    return;
  }
  if(!ended) lastRemoteEnded = false;
  const phaseChanged = remotePhase !== lastRemotePhase;
  if(phaseChanged){
    phase = remotePhase;
    lastRemotePhase = remotePhase;
    if(phase === PHASE_FINAL){
      renderEnd();
      return;
    }
  }
  if(typeof remoteCurrent === 'number' && remoteCurrent >= 0 && remoteCurrent < total && (remoteCurrent !== lastRemoteCurrent || phaseChanged)){
    lastRemoteCurrent = remoteCurrent;
    current = remoteCurrent;
    renderQuestion(current);
  }
  updateHeader();
}
function applyPresentationState(){
  if(sessionMode !== 'presentation' || !sharedState) return;
  const remotePhase = sharedState.get('phase') || PHASE_ROUND1;
  const ended = sharedState.get('ended') === true;
  const remoteCurrent = sharedState.get('current');
  if(typeof remoteCurrent === 'number' && remoteCurrent >= 0 && remoteCurrent < ROUND1_COUNT){
    current = remoteCurrent;
  }
  phase = ended ? PHASE_FINAL : remotePhase;
  if(phase === PHASE_FINAL){
    renderPresentationView(current, true);
    return;
  }
  renderPresentationView(current);
}
function hasActivePresenter(){
  if(!sharedState) return false;
  const token = sharedState.get('presenterToken');
  const heartbeat = sharedState.get('presenterHeartbeat') || 0;
  return !!token && (Date.now() - heartbeat) < 10000;
}
function hasActivePresentation(){
  if(!sharedState) return false;
  const token = sharedState.get('presentationToken');
  const heartbeat = sharedState.get('presentationHeartbeat') || 0;
  return !!token && (Date.now() - heartbeat) < 10000;
}
function dynamicImportCompat(url){
  return (new Function('u', 'return import(u)'))(url);
}
async function loadRealtimeLibs(){
  if(firebaseFns && firebaseDb) return true;
  try{
    const appMod = await dynamicImportCompat('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
    const dbMod = await dynamicImportCompat('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
    const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(FIREBASE_CONFIG);
    firebaseApp = app;
    firebaseDb = dbMod.getDatabase(firebaseApp);
    firebaseFns = {
      ref: dbMod.ref,
      child: dbMod.child,
      set: dbMod.set,
      get: dbMod.get,
      onValue: dbMod.onValue,
      remove: dbMod.remove,
      update: dbMod.update,
      runTransaction: dbMod.runTransaction,
      onDisconnect: dbMod.onDisconnect
    };
    return true;
  }catch(err){
    console.error(err);
    realtimeEnabled = false;
    return false;
  }
}
async function initRealtime(){
  if(!(await loadRealtimeLibs())) return false;
  destroyRealtime();

  sharedState = createFirebaseSharedState();
  firebaseSessionRoot = firebaseFns.ref(firebaseDb, `sessions/${PUBLIC_ROOM_ID}`);
  firebaseStateRef = firebaseFns.child(firebaseSessionRoot, 'state');
  firebaseResultsRef = firebaseFns.child(firebaseSessionRoot, 'results');

  const initialSync = new Promise(resolve => {
    let stateReady = false, resultsReady = false;
    const check = () => { if(stateReady && resultsReady) resolve(); };
    firebaseStateUnsub = firebaseFns.onValue(firebaseStateRef, snap => {
      sharedState.replaceState(snap.val() || {});
      if(!stateReady){ stateReady = true; check(); }
    });
    firebaseResultsUnsub = firebaseFns.onValue(firebaseResultsRef, snap => {
      sharedState.replaceResults(snap.val() || {});
      if(!resultsReady){ resultsReady = true; check(); }
    });
    setTimeout(resolve, 4000); /* safety timeout */
  });
  await initialSync;

  if(sessionMode === 'presenter'){
    presenterToken = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const tokenRef = firebaseFns.child(firebaseStateRef, 'presenterToken');
    try {
      const result = await firebaseFns.runTransaction(tokenRef, (currentToken) => {
        const hb = sharedState.get('presenterHeartbeat') || 0;
        if(currentToken && (Date.now() - hb) < 10000){
          return; /* abort — another presenter is active */
        }
        return presenterToken;
      });
      if(!result.committed){
        alert('A presenter is already active. Please select Participant mode.');
        presenterToken = '';
        destroyRealtime();
        return false;
      }
    } catch(e){
      console.error('Transaction failed:', e);
      alert('Could not claim presenter slot. Try again.');
      presenterToken = '';
      destroyRealtime();
      return false;
    }
    sharedState.set('presenterName', nameVal);
    sharedState.set('presenterHeartbeat', Date.now());
    /* Server-side cleanup if browser closes without calling destroyRealtime */
    if(firebaseFns.onDisconnect){
      firebaseFns.onDisconnect(firebaseFns.child(firebaseStateRef,'presenterToken')).remove().catch(()=>{});
      firebaseFns.onDisconnect(firebaseFns.child(firebaseStateRef,'presenterHeartbeat')).set(0).catch(()=>{});
    }
    const isNewQuizPresentation = phase === PHASE_ROUND1
      && current === 0
      && score === 0
      && Array.isArray(answered)
      && answered.length === 0;
    if(isNewQuizPresentation && firebaseFns && firebaseResultsRef){
      await firebaseFns.remove(firebaseResultsRef).catch(e => console.error('Firebase reset error:', e));
      sharedState.replaceResults({});
    }
    if(firebaseFns && firebaseStateRef){
      const updates = { phase, ended: false, current, updatedAt: Date.now() };
      await firebaseFns.update(firebaseStateRef, updates).catch(e => console.error('Firebase update error:', e));
    }
    presenterHeartbeatTimer = setInterval(()=>{
      if(sharedState && sharedState.get('presenterToken') === presenterToken){
        sharedState.set('presenterHeartbeat', Date.now());
      }
    }, 5000);
    sharedStateObserverUnsub = sharedState.observe(()=>{
      if(sessionMode !== 'presenter') return;
      if(phase === PHASE_FINAL || (sharedState.get('ended') === true && current >= ROUND1_COUNT-1)){
        phase = PHASE_FINAL;
        renderEnd();
        return;
      }
      if(isQuestionPhase()){
        updateHeader();
        updateSyncedQuestionStatsUI();
      }
    });
  } else if(sessionMode === 'presentation'){
    presentationToken = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const tokenRef = firebaseFns.child(firebaseStateRef, 'presentationToken');
    try {
      const result = await firebaseFns.runTransaction(tokenRef, (currentToken) => {
        const hb = sharedState.get('presentationHeartbeat') || 0;
        if(currentToken && (Date.now() - hb) < 10000){
          return;
        }
        return presentationToken;
      });
      if(!result.committed){
        alert('Presentation view is already active on another screen.');
        presentationToken = '';
        destroyRealtime();
        return false;
      }
    } catch(e){
      console.error('Presentation transaction failed:', e);
      alert('Could not claim presentation view. Try again.');
      presentationToken = '';
      destroyRealtime();
      return false;
    }
    sharedState.set('presentationName', nameVal);
    sharedState.set('presentationHeartbeat', Date.now());
    presentationHeartbeatTimer = setInterval(()=>{
      if(sharedState && sharedState.get('presentationToken') === presentationToken){
        sharedState.set('presentationHeartbeat', Date.now());
      }
    }, 5000);
    isPresentationReady = true;
    sharedStateObserverUnsub = sharedState.observe(()=>{
      if(sessionMode !== 'presentation') return;
      applyPresentationState();
    });
  } else {
    sharedStateObserverUnsub = sharedState.observe(()=>{
      applyParticipantState();
      if(isQuestionPhase()){
        updateHeader();
        updateSyncedQuestionStatsUI();
      }
    });
  }
  realtimeTransport = 'firebase';
  return true;
}
async function forceResetAll(){
  const modeIn = document.getElementById('modeIn');
  const presenterOption = modeIn ? modeIn.querySelector('option[value="presenter"]') : null;
  const presentationOption = modeIn ? modeIn.querySelector('option[value="presentation"]') : null;
  const presenterAvailable = !!presenterOption && !presenterOption.disabled;
  const presentationAvailable = !!presentationOption && !presentationOption.hidden && !presentationOption.disabled;
  if(!(presenterAvailable || presentationAvailable)){
    alert('Force Reset is disabled when only Participant mode is available.');
    return;
  }
  if(!confirm('Clear all session data and Firebase room state?\nThis resets scores, results, and tokens for everyone in this room.')) return;
  destroyRealtime();
  clearSessionState();
  sessionMode = 'participant';
  phase = PHASE_ROUND1;
  current = 0; score = 0; answered = [];
  participantFeedback = {};
  nameVal = ''; aliasVal = '';
  lastRemoteCurrent = -1;
  lastRemoteEnded = false;
  lastRemotePhase = '';
  isPresentationReady = false;
  try{

      const sessionRef = firebaseFns.ref(firebaseDb, `sessions/${PUBLIC_ROOM_ID}`);
      const stateRef = firebaseFns.child(sessionRef, 'state');
      const resultsRef = firebaseFns.child(sessionRef, 'results');
      await firebaseFns.update(stateRef, {
        presenterToken: null, presenterHeartbeat: 0, presenterName: null,
        presentationToken: null, presentationHeartbeat: 0, presentationName: null,
        phase: PHASE_ROUND1, ended: false, current: 0
      }).catch(e => console.error('Reset state error:', e));
      await firebaseFns.remove(resultsRef).catch(e => console.error('Reset results error:', e));

}

    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){
      alert("Results copied. Paste into the organizer's form.");
      return;
    }
  }catch(_err){}
  alert('Copy failed. Select and copy manually:\n'+text);
}
function retake(){
  destroyRealtime();
  clearSessionState();
  sessionMode = 'participant';
  phase = PHASE_ROUND1;
  current=-1; score=0; answered=[];
  participantFeedback = {};
  lastRemoteCurrent = -1;
  lastRemoteEnded = false;
  lastRemotePhase = '';
  isPresentationReady = false;
  renderLanding();
  updateHeader();
}
async function startQuiz(){
  stopLandingPresenterWatch();
  const selectedMode = document.getElementById('modeIn').value;
  const n = document.getElementById('nameIn').value.trim();
  if(selectedMode === 'participant' && !n){
    alert('Please enter your Name or Alias to continue.');
    return;
  }
  participantId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  nameVal = selectedMode === 'participant'
    ? n
    : selectedMode === 'presentation'
      ? 'Presentation Screen'
      : 'Presenter Screen';
  aliasVal = '';
  sessionMode = selectedMode;
  phase = PHASE_ROUND1;
  score = 0;
  answered = [];
  participantFeedback = {};
  lastRemoteCurrent = -1;
  lastRemoteEnded = false;
  lastRemotePhase = '';

  if(sessionMode === 'presenter'){
    current = 0;
    realtimeEnabled = await initRealtime();
    if(!realtimeEnabled){
      alert('Presenter mode could not start because live sync is unavailable. Check internet or firewall access to Firebase, then try again.');
      sessionMode = 'participant';
      renderLanding();
      return;
    }
    renderQuestion(current);
    pushPresenterState(false);
    return;
  }

  if(sessionMode === 'presentation'){
    current = 0;
    realtimeEnabled = await initRealtime();
    if(!realtimeEnabled || !isPresentationReady){
      if(!realtimeEnabled){
        alert('Presentation View could not start because live sync is unavailable. Check internet or firewall access to Firebase, then try again.');
      }
      sessionMode = 'participant';
      renderLanding();
      return;
    }
    if(sharedState) applyPresentationState();
    else renderPresentationView(current);
    return;
  }

  current = 0;
  realtimeEnabled = await initRealtime();
  renderQuestion(current);
  saveSessionState();
  if(realtimeEnabled && sharedState){
    lastRemoteCurrent = -1;
    lastRemoteEnded = sharedState.get('ended') === true;
    lastRemotePhase = '';
    applyParticipantState();
  }
}
/* Cleanup tokens if tab/window is closed */
window.addEventListener('beforeunload', () => { destroyRealtime(); });
/* init */
renderLanding(); updateHeader();
if(restoreSessionState()){
  resumeRealtimeAfterRestore().catch(e => console.error('Realtime restore failed:', e));
}
