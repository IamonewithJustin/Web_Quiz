<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trust and Resilience Wordcloud</title>
<style>
  :root{--purple:#6a1b9a;--green:#2e7d32;--gold:#c0a000;--ink:#1b1b1b;--bg:#fffdf7;--muted:#f3efe2}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:contain}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .mask{width:40px;height:40px;border-radius:8px;background:
    radial-gradient(circle at 30% 30%,#fff 0 12px,transparent 12px),
    linear-gradient(135deg,var(--purple),var(--green),var(--gold));
    box-shadow:0 2px 8px rgba(0,0,0,.15)}
  h1{font-size:1.25rem;margin:0}
  .card{background:#fff;border:1px solid #eadfbf;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.06);overflow:hidden}
  .hero{padding:18px;background:
    repeating-linear-gradient(135deg,rgba(106,27,154,.10),rgba(106,27,154,.10) 8px,transparent 8px,transparent 16px),
    linear-gradient(135deg,rgba(46,125,50,.08),rgba(192,160,0,.08));border-bottom:1px solid #eadfbf}
  .hero h2{margin:.1rem 0 .35rem 0;font-size:1.1rem}
  .small{font-size:.92rem;color:#333}
  .body{padding:18px}
  .progress{height:8px;background:var(--muted);border-radius:999px;overflow:hidden;margin:8px 0 14px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--green),var(--gold))}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  input[type="text"],input[type="number"]{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd}
  .choices{display:grid;gap:10px;margin-top:8px}
  .choice{border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;cursor:pointer}
  .choice:hover{border-color:#c9b98a;background:#fffdf2}
  .choice-media{align-items:center}
  .choice-thumb{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid #eadfbf;flex:0 0 auto}
  .controls{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--purple);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  button.secondary{background:#eee;color:#222}
  button.outline{background:#fff;border:1px solid #c9b98a;color:#222}
  button:disabled{opacity:.55;cursor:not-allowed}
  .tag{padding:6px 10px;border-radius:999px;font-size:.9rem;border:1px solid #eadfbf;background:#fff;display:inline-block;margin-right:8px}
  .center{text-align:center}
  details summary{cursor:pointer}
  .slide-banner{width:min(100%,540px);aspect-ratio:32/27;margin:0 auto 10px;border-radius:12px;background-color:#000;background-size:contain;background-repeat:no-repeat;background-position:center center;border:1px solid #eadfbf}
  .feedback-banner{margin-top:10px;padding:14px 16px;border-radius:14px;border:2px solid;font-size:1.05rem;font-weight:800;line-height:1.35;letter-spacing:.2px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .feedback-banner .label{display:block;font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
  .feedback-correct{color:#fff;background:linear-gradient(135deg,var(--green),var(--purple));border-color:var(--green)}
  .feedback-wrong{color:#fff;background:linear-gradient(135deg,var(--purple),var(--gold));border-color:var(--gold)}
  .answer-fact-card{margin-top:10px;padding:12px 14px;border-radius:12px;border:1px solid #eadfbf;background:#fff;color:#111;font-weight:400}
  .synced-score-callout{width:100%;box-sizing:border-box;margin-top:8px;padding:8px 14px;border-radius:10px;border:1px solid rgba(106,27,154,.25);background:rgba(106,27,154,.06);color:#3d0a5a;font-size:.92rem;font-weight:500;letter-spacing:.1px}
  .synced-score-label{font-weight:600;font-size:.82rem;letter-spacing:.3px;margin-right:12px;color:#5a0f7a}
  .synced-correct{color:#58d68d}
  .synced-incorrect{color:#ff6b6b}
  .synced-value-correct{color:#7dff9f;font-weight:900;font-size:1.08rem}
  .synced-value-incorrect{color:#ff7d7d;font-weight:900;font-size:1.08rem}
  .presentation-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.2fr);gap:10px;align-items:start}
  .presentation-panel{background:#fff;border:1px solid #eadfbf;border-radius:12px;padding:14px}
  .qtext{font-size:1.5rem;font-weight:900;line-height:1.35;color:#5a0f7a;border-left:6px solid var(--purple);padding:16px 18px;background:linear-gradient(135deg,rgba(106,27,154,.08),rgba(106,27,154,.12));border-radius:0 14px 14px 0;margin:16px 0 14px;box-shadow:0 3px 10px rgba(106,27,154,.15)}
  .presentation-panel .qtext{font-size:2.2rem;line-height:1.25}
  .presentation-panel .small{font-size:1rem}
  .presentation-panel ol.small li{font-size:1.03rem;line-height:1.45;margin-bottom:4px}
  .presentation-pie{width:160px;height:160px;border-radius:50%;border:1px solid #eadfbf;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:#222;flex-shrink:0}
  .presentation-bottom-row{display:flex;gap:12px;align-items:center;margin-top:10px}
  .presentation-bottom-row .synced-score-callout{flex:1;margin:0}
  .presentation-pie-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;transform:translateY(-40%)}
  .presentation-legend{display:grid;gap:6px;margin-top:8px;min-width:160px}
  .presentation-legend .item{display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
  .presentation-legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
  /* projector-safe viewport fit */
  body.presentation-active{overflow-y:auto}
  body.presentation-active .wrap{max-width:100%;padding:4px 10px 2px;display:flex;flex-direction:column;height:100vh;height:100dvh;box-sizing:border-box}
  body.presentation-active header{flex-shrink:0;margin-bottom:2px}
  body.presentation-active .card{flex:1;overflow-y:auto;min-height:0;border-radius:8px;display:flex;flex-direction:column}
  body.presentation-active .hero{flex-shrink:0;padding:8px 12px}
  body.presentation-active .body{flex:1;overflow-y:auto;min-height:0;padding:8px 10px}
  body.presentation-active .presentation-grid{align-items:start}
  body.presentation-active .presentation-panel{box-sizing:border-box;overflow-y:visible}
  body.presentation-active .slide-banner{height:clamp(120px,22vh,170px);width:100%;aspect-ratio:unset}
  body.presentation-active .wrap > p.small{display:none}
  @media (max-width:760px){.presentation-grid{grid-template-columns:1fr}}
  @media (max-height:760px){
    body.presentation-active .presentation-panel .qtext{font-size:1.7rem}
    body.presentation-active .presentation-panel .small{font-size:.92rem}
    body.presentation-active .presentation-panel ol.small li{font-size:.94rem;line-height:1.35}
    body.presentation-active .presentation-pie{width:140px;height:140px;font-size:.95rem}
    body.presentation-active .presentation-bottom-row{gap:8px;margin-top:8px}
  }
  @media (max-width:480px){.slide-banner{width:min(92vw,400px)}}
  @keyframes scroll-text { from{transform:translateX(100%)} to{transform:translateX(-100%)} }
  .ticker-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; overflow:hidden }
  .ticker-name { font-weight:700; min-width:80px; flex-shrink:0; font-size:.9rem; white-space:nowrap }
  .ticker-track { overflow:hidden; white-space:nowrap; flex:1 }
  .ticker-text { display:inline-block; animation: scroll-text linear infinite }
  .wordcloud-wrap { position:relative; width:100%; display:flex; align-items:center; justify-content:center; margin-top:12px }
  @keyframes wc-word-arrive { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)} 35%{opacity:1;transform:translate(-50%,-50%) scale(1.25)} 65%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(0.75) translateY(-28px)} }
  .wc-fly-word{position:absolute;pointer-events:none;font-weight:900;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.22);animation:wc-word-arrive 1.6s ease-out forwards;z-index:10}
  .wordcloud-wrap canvas { max-width:100%; border-radius:12px; background:#fafafa }
  .anonymous-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eadfbf;border-radius:12px;background:#fff}
  .anonymous-toggle input{width:auto;margin:0}
  .all-clouds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
  .all-cloud-card{background:#fff;border:1px solid #eadfbf;border-radius:12px;padding:14px}
  .all-cloud-card h4{margin:0 0 8px;font-size:1rem}
  .all-cloud-card canvas{width:100%;max-width:100%;border-radius:12px;background:#fafafa}
  .response-list{margin:10px 0 0;padding-left:18px;text-align:left}
  .response-list li{margin-bottom:6px;line-height:1.4}
  .pdf-export-root{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;padding:0;z-index:-1}
  .pdf-export-page{width:760px;box-sizing:border-box;padding:24px;border-bottom:1px solid #ddd;background:#fff}
  .reaction-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding:8px 12px;background:rgba(106,27,154,.04);border-radius:10px;border:1px solid rgba(106,27,154,.12)}
  .rxn-btn{background:#fff;border:1px solid #eadfbf;border-radius:999px;padding:5px 11px;font-size:1.4rem;cursor:pointer;box-shadow:none;line-height:1;color:inherit;min-width:0;transition:transform .12s,background .12s;width:auto}
  .rxn-btn:active{transform:scale(.82);background:var(--muted)}
  @keyframes rxn-float{0%{opacity:0;transform:translateY(0) scale(.4)}18%{opacity:1;transform:translateY(-40px) scale(1.5)}80%{opacity:.85;transform:translateY(-170px) scale(1.15)}100%{opacity:0;transform:translateY(-230px) scale(.9)}}
  .rxn-float{position:fixed;pointer-events:none;font-size:4.5rem;animation:rxn-float 2.8s ease-out forwards;z-index:9999;user-select:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
  .top-word{font-weight:900;border-radius:3px;padding:0 2px}
  .top-word.rank-1{color:#6b21a8;font-size:1.06em;background:rgba(106,27,154,.12)}
  .top-word.rank-2{color:#15803d;font-size:1.03em;background:rgba(21,128,61,.09)}
  .top-word.rank-3{color:#b45309;background:rgba(180,83,9,.08)}
  @keyframes milestone-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.92) translateY(-20px)}}
  .milestone-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;background:linear-gradient(135deg,#6b21a8,#9c27b0);color:#fff;font-size:2.8rem;font-weight:900;padding:22px 52px;border-radius:20px;text-align:center;pointer-events:none;animation:milestone-pop 3.4s ease-out forwards;box-shadow:0 12px 40px rgba(106,27,154,.55);white-space:nowrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<body>
<div class="wrap">
  <header><div class="mask" aria-hidden="true"></div><h1>Trust and Resilience Wordcloud</h1></header>
  <div class="card">
    <div class="hero">
      <h2 id="title">Share your perspective</h2>
      <div class="progress" aria-label="Progress"><div class="bar" id="bar"></div></div>
      <div><span class="tag" id="tagQ">Q: 0/10</span><span class="tag" id="tagScore">Score: 0</span></div>
    </div>
    <div class="body" id="screen"></div>
  </div>
  <p class="small" style="margin-top:12px">Tip: Works great on phones. If anything looks cached, pull-to-refresh.</p>
</div>

<script>
/*** ====== SURVEY DATA ====== ***/
const QUESTIONS = [
  { text: "What behaviors or practices reduce trust in your team?" },
  { text: "What behaviors or practices weaken resilience during change?" }
];
const ROUND1_COUNT = QUESTIONS.length;
const total = QUESTIONS.length;
const PHASE_LOBBY = 'lobby';
const PHASE_ROUND1 = 'round1';
const PHASE_FINAL = 'final';

let score = 0;
let answered = []; // selected option indexes (absolute index across all rounds)
let nameVal = "", aliasVal = "";
let sessionMode = 'participant'; // presentation | participant
let phase = PHASE_ROUND1;
let current = -1;
let sharedState = null;
let firebaseApp = null;
let firebaseDb = null;
let firebaseFns = null;
let firebaseSessionRoot = null;
let firebaseStateRef = null;
let firebaseResultsRef = null;
let firebaseStateUnsub = null;
let firebaseResultsUnsub = null;
let realtimeTransport = 'offline';
let sharedStateObserverUnsub = null;
let presentationToken = '';
let presentationHeartbeatTimer = null;
let participantId = '';
let participantFeedback = {};
let qrCodeDataUrl = '';
let qrCodeFileName = '';
let prevWordKeys = new Set();
let lastReactionKeys = new Set();
let presentationStartTime = 0;
let reactionCooldown = false;
let milestoneShown = new Set();
let lastRemoteCurrent = -1;
let lastRemoteEnded = false;
let lastRemotePhase = '';
let lastPresentationCurrent = -1;
let lastPresentationPhase = '';
let lastPresentationResultsCount = -1;
let lastPresentationQr = '';
let realtimeEnabled = true;
let anonymousJoin = false;
let landingPresentationActive = false;
let landingStatusKnown = false;
let landingStatusTimer = null;
const SESSION_STORAGE_KEY = 'wrdcld-session-v2';
const PUBLIC_ROOM_ID = 'mardi-gras-public-session';
const DEFAULT_QR_PATH = 'assets/qr-default.png';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBoaFArhEidJBLEEUFGqe3a0X3jOc-7UZQ",
  authDomain: "webquiz-26c83.firebaseapp.com",
  databaseURL: "https://webquiz-26c83-default-rtdb.firebaseio.com",
  projectId: "webquiz-26c83",
  storageBucket: "webquiz-26c83.firebasestorage.app",
  messagingSenderId: "636029354938",
  appId: "1:636029354938:web:5b403935e21e4abe5d5383",
  measurementId: "G-Z83N35PWKW"
};





// UI
const screen = document.getElementById('screen');
const bar = document.getElementById('bar');
const tagQ = document.getElementById('tagQ');
const tagScore = document.getElementById('tagScore');

function saveSessionState(){
  try{
    const payload = {
      nameVal,
      aliasVal,
      sessionMode,
      phase,
      current,
      score,
      answered,
      qrCodeDataUrl,
      participantFeedback,
      participantId,
      savedAt: Date.now()
    };
    sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(payload));
  }catch(e){}
}
function clearSessionState(){
  try{ sessionStorage.removeItem(SESSION_STORAGE_KEY); }catch(e){}
}
function stopLandingStatusWatch(){
  if(landingStatusTimer){ clearInterval(landingStatusTimer); landingStatusTimer = null; }
}
async function refreshLandingAvailability(){
  let isActive = false;
  try{
    if(await loadRealtimeLibs()){
      const stateRef = firebaseFns.ref(firebaseDb, `sessions/${PUBLIC_ROOM_ID}/state`);
      const snap = await firebaseFns.get(stateRef);
      const state = snap.val() || {};
      const token = state.presentationToken;
      const heartbeat = state.presentationHeartbeat || 0;
      isActive = !!token && (Date.now() - heartbeat) < 10000;
    }
  }catch(e){
    console.error('Landing availability check failed:', e);
  }
  landingPresentationActive = isActive;
  landingStatusKnown = true;
  const noteEl = document.getElementById('landingAvailNote');
  const btnEl  = document.getElementById('startPresentationBtn');
  if(noteEl){
    noteEl.innerHTML = isActive
      ? '<strong>A Presentation View session is already active.</strong> Starting a new one will reset the room.'
      : '';
    noteEl.style.display = isActive ? '' : 'none';
  }
  if(btnEl) btnEl.style.display = isActive ? 'none' : '';
}
function startLandingStatusWatch(){
  stopLandingStatusWatch();
  landingStatusKnown = false;
  refreshLandingAvailability();
  landingStatusTimer = setInterval(()=>{ refreshLandingAvailability(); }, 2000);
}
function toggleAnonymousJoin(checked){
  anonymousJoin = !!checked;
  const nameIn = document.getElementById('nameIn');
  if(!nameIn) return;
  if(anonymousJoin){
    if(!nameIn.dataset.savedValue) nameIn.dataset.savedValue = nameIn.value;
    nameIn.value = 'Anonymous';
    nameIn.disabled = true;
  } else {
    nameIn.disabled = false;
    nameIn.value = nameIn.dataset.savedValue || '';
    delete nameIn.dataset.savedValue;
  }
}
function restoreSessionState(){
  try{
    const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
    if(!raw) return false;
    const state = JSON.parse(raw);
    if(!state || typeof state !== 'object') return false;
    if(!state.nameVal || typeof state.nameVal !== 'string') return false;

    nameVal = state.nameVal;
    aliasVal = typeof state.aliasVal === 'string' ? state.aliasVal : '';
    if(state.sessionMode === 'participant' || state.sessionMode === 'presentation'){
      sessionMode = state.sessionMode;
    } else {
      sessionMode = 'participant';
    }
    phase = typeof state.phase === 'string' ? state.phase : (sessionMode === 'presentation' ? PHASE_LOBBY : PHASE_ROUND1);
    current = typeof state.current === 'number' ? state.current : 0;
    score = typeof state.score === 'number' ? state.score : 0;
    answered = Array.isArray(state.answered) ? state.answered : [];
    participantFeedback = state.participantFeedback && typeof state.participantFeedback === 'object' ? state.participantFeedback : {};
    participantId = (typeof state.participantId === 'string' && state.participantId) ? state.participantId : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    qrCodeDataUrl = typeof state.qrCodeDataUrl === 'string' ? state.qrCodeDataUrl : '';

    if(phase === PHASE_FINAL){
      if(sessionMode === 'presentation'){
        renderPresentationView(current, true);
        return true;
      }
      renderEnd();
      return true;
    }
    if(sessionMode === 'presentation' && phase === PHASE_LOBBY){
      renderPresentationLobby();
      return true;
    }
    if(current < 0 || current >= ROUND1_COUNT) current = 0;
    if(sessionMode === 'presentation'){
      renderPresentationView(current);
      return true;
    }
    renderQuestion(current);
    return true;
  }catch(e){
    return false;
  }
}
async function resumeRealtimeAfterRestore(){
  if((sessionMode !== 'participant' && sessionMode !== 'presentation') || !nameVal) return;
  const restoredPhase = phase;
  const restoredCurrent = current;
  const ok = await initRealtime();
  realtimeEnabled = ok;
  if(!ok || !sharedState) return;

  lastRemoteCurrent = -1;
  lastRemoteEnded = sharedState.get('ended') === true;
  lastRemotePhase = '';
  lastPresentationCurrent = -1;
  lastPresentationPhase = '';
  lastPresentationResultsCount = -1;

  if(hasActivePresentation()){
    if(sessionMode === 'participant') applyParticipantState();
    else applyPresentationState();
    return;
  }

  if(restoredPhase === PHASE_FINAL){
    if(sessionMode === 'presentation') renderPresentationView(restoredCurrent, true);
    else renderEnd();
    return;
  }
  if(restoredCurrent >= 0 && restoredCurrent < ROUND1_COUNT){
    if(sessionMode === 'presentation') renderPresentationView(restoredCurrent);
    else renderQuestion(restoredCurrent);
  }
}

/*** ====== HELPERS ====== ***/
function modeText(){
  if(!realtimeEnabled) return 'Offline mode';
  if(sessionMode === 'presentation') return 'Presentation \u2022 Sync: ' + realtimeTransport;
  return 'Participant \u2022 Sync: ' + realtimeTransport;
}
function setPresentationShell(enabled){
  const wrap = document.querySelector('.wrap');
  if(!wrap) return;
  wrap.style.maxWidth = enabled ? '100%' : '760px';
  if(enabled) document.body.classList.add('presentation-active');
  else document.body.classList.remove('presentation-active');
}
function isQuestionPhase(){
  return phase === PHASE_ROUND1;
}
function renderBanner(index = 0){
  if(index < 0 || index >= QUESTIONS.length || !QUESTIONS[index].image) return '';
  return `<div class="slide-banner" style="background-image:url('${QUESTIONS[index].image}')"></div>`;
}
function updateHeader(){
  if(phase === PHASE_LOBBY){
    bar.style.width = '0%';
    tagQ.textContent = sessionMode === 'presentation' ? 'Display • Lobby' : 'Waiting Room';
    if(sessionMode === 'presentation'){
      tagScore.style.display = 'none';
    } else {
      tagScore.style.display = 'inline-block';
      tagScore.textContent = `Responses: ${score}/${total}`;
    }
    return;
  }
  const idx = Math.max(0,current+1);
  let pct = 0;
  if(phase === PHASE_ROUND1){
    pct = current < 0 ? 0 : Math.round(((idx)/total)*100);
    if(sessionMode === 'presentation'){
      tagQ.textContent = current < 0 ? `Display • Q 0/${ROUND1_COUNT}` : `Display • Q ${current+1}/${ROUND1_COUNT}`;
    } else {
      tagQ.textContent = current < 0 ? `Q 0/${ROUND1_COUNT}` : `Q ${current+1}/${ROUND1_COUNT}`;
    }
  } else {
    pct = 100;
    tagQ.textContent = sessionMode === 'presentation' ? 'Display • Final Standings' : 'Final Standings';
  }
  bar.style.width = pct + '%';
  if(sessionMode === 'presentation'){
    tagScore.style.display = 'none';
  } else {
    tagScore.style.display = 'inline-block';
    tagScore.textContent = `Responses: ${score}/${total}`;
  }
}
function shouldShowSyncedQuestionStats(){
  return isQuestionPhase() && realtimeEnabled && !!sharedState;
}
function syncedQuestionStatsLabel(index){
  const stats = getSyncedQuestionStats(index);
  return `<span class="synced-score-label">Responses: <strong>${stats.totalResponses}</strong></span><span class="synced-score-label">Submitters: <strong>${stats.submitters}</strong></span>`;
}
function updateSyncedQuestionStatsUI(){
  const el = document.getElementById('syncedQuestionStats');
  if(!el) return;
  if(!shouldShowSyncedQuestionStats()){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = syncedQuestionStatsLabel(current);
}
function destroyRealtime(){
  if(presentationHeartbeatTimer){ clearInterval(presentationHeartbeatTimer); presentationHeartbeatTimer = null; }
  if(sharedStateObserverUnsub){ sharedStateObserverUnsub(); sharedStateObserverUnsub = null; }

    sharedState.delete('presentationToken');

  }

  if(firebaseStateUnsub){ firebaseStateUnsub(); firebaseStateUnsub = null; }
  if(firebaseResultsUnsub){ firebaseResultsUnsub(); firebaseResultsUnsub = null; }
  firebaseSessionRoot = null;
  firebaseStateRef = null;
  firebaseResultsRef = null;
  sharedState = null;

}
function createFirebaseSharedState(){
  const stateData = {};
  const resultData = {};
  const observers = new Set();
  const notify = ()=> observers.forEach(cb => { try{ cb(); }catch(err){ console.error(err); } });

  return {
    set(key, value){
      if(typeof key !== 'string') return;
      if(key.startsWith('result:')){
        const resultId = key.slice(7);
        try{
          resultData[resultId] = typeof value === 'string' ? JSON.parse(value) : value;
        }catch(e){
          resultData[resultId] = value;
        }
        if(firebaseFns && firebaseResultsRef){
          const resultRef = firebaseFns.child(firebaseResultsRef, resultId);
          firebaseFns.set(resultRef, resultData[resultId]).catch(e => console.error('Firebase write error:', e));
        }
        notify();
        return;
      }
      stateData[key] = value;
      if(firebaseFns && firebaseStateRef){
        const keyRef = firebaseFns.child(firebaseStateRef, key);
        firebaseFns.set(keyRef, value).catch(e => console.error('Firebase write error:', e));
      }
      notify();
    },
    get(key){
      if(typeof key !== 'string') return undefined;
      if(key.startsWith('result:')){
        const resultId = key.slice(7);
        const value = resultData[resultId];
        return value == null ? undefined : JSON.stringify(value);
      }
      return stateData[key];
    },
    delete(key){
      if(typeof key !== 'string') return;
      if(key.startsWith('result:')){
        const resultId = key.slice(7);
        delete resultData[resultId];
        if(firebaseFns && firebaseResultsRef){
          const resultRef = firebaseFns.child(firebaseResultsRef, resultId);
          firebaseFns.remove(resultRef).catch(e => console.error('Firebase remove error:', e));
        }
        notify();
        return;
      }
      delete stateData[key];
      if(firebaseFns && firebaseStateRef){
        const keyRef = firebaseFns.child(firebaseStateRef, key);
        firebaseFns.remove(keyRef).catch(e => console.error('Firebase remove error:', e));
      }
      notify();
    },
    forEach(cb){
      Object.entries(stateData).forEach(([k,v])=> cb(v, k));
      Object.entries(resultData).forEach(([k,v])=> cb(JSON.stringify(v), `result:${k}`));
    },
    observe(cb){
      observers.add(cb);
      return ()=> observers.delete(cb);
    },
    replaceState(next){
      Object.keys(stateData).forEach(k => delete stateData[k]);
      Object.assign(stateData, next || {});
      notify();
    },
    replaceResults(next){
      Object.keys(resultData).forEach(k => delete resultData[k]);
      Object.assign(resultData, next || {});
      notify();
    }
  };
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function highlightTopWords(text, topWords){

function buildWordFrequency(qIndex){
  const STOP_WORDS = new Set(['a','an','the','and','or','but','in','on','at','to','for','of','with','by','from','is','it','its','this','that','these','those','was','are','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','not','no','so','if','as','up','out','my','your','their','our','we','i','you','they','he','she','his','her','their','more','also','just','than','when','what','how','all','some','any','each','which']);
  const freq = {};
  getSharedResults().forEach(r => {
    const picks = Array.isArray(r.answers) ? r.answers : [];
    const slot = picks[qIndex];
    const texts = Array.isArray(slot) ? slot : (slot && typeof slot === 'string' ? [slot] : []);
    texts.forEach(text => {
      if(!text || typeof text !== 'string') return;
      const words = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP_WORDS.has(w));
      words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      for(let i = 0; i < words.length - 1; i++){
        const bigram = words[i] + ' ' + words[i+1];
        freq[bigram] = (freq[bigram] || 0) + 0.5;
      }
    });
  });
  return Object.entries(freq).sort((a,b) => b[1]-a[1]);
}
function renderWordCloudToCanvas(canvas, qIndex){

  const list = buildWordFrequency(qIndex);
  if(!list.length){ canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); return; }
  const maxFreq = list[0][1] || 1;
  WordCloud(canvas, {
    list,
    weightFactor: w => Math.max(14, Math.min(60, (w / maxFreq) * 60)),
    color: () => ['#6b21a8','#15803d','#b45309'][Math.floor(Math.random()*3)],
    rotateRatio: 0,
    backgroundColor: '#fafafa',
    gridSize: 8,
    minSize: 10
  });
}

  }
  const remotePhase = sharedState.get('phase') || PHASE_LOBBY;

  }
  if(!ended) lastRemoteEnded = false;
  const phaseChanged = remotePhase !== lastRemotePhase;
  if(phaseChanged){
    phase = remotePhase;

      return;
    }
    if(phase === PHASE_FINAL){
      renderEnd();
      return;
    }
  }
  if(typeof remoteCurrent === 'number' && remoteCurrent >= 0 && remoteCurrent < total && (remoteCurrent !== lastRemoteCurrent || phaseChanged)){
    lastRemoteCurrent = remoteCurrent;
    current = remoteCurrent;

  }

  if(typeof remoteQr === 'string') qrCodeDataUrl = remoteQr;

function applyPresentationState(){
  if(sessionMode !== 'presentation' || !sharedState) return;
  const remotePhase = sharedState.get('phase') || PHASE_LOBBY;
  const ended = sharedState.get('ended') === true;
  const remoteCurrent = sharedState.get('current');
  const newCurrent = (typeof remoteCurrent === 'number' && remoteCurrent >= 0 && remoteCurrent < ROUND1_COUNT) ? remoteCurrent : current;
  const newPhase = ended ? PHASE_FINAL : remotePhase;

  const resultsFingerprint = getSharedResults().reduce((sum, r) => {
    const picks = Array.isArray(r.answers) ? r.answers : [];
    return sum + picks.reduce((s, slot) => s + (Array.isArray(slot) ? slot.length : (slot ? 1 : 0)), 0);
  }, 0);

  const stateChanged = newPhase !== lastPresentationPhase || newCurrent !== lastPresentationCurrent;
  const qrChanged = (sharedState.get('qrCodeDataUrl') || '') !== lastPresentationQr;
  const resultsChanged = resultsFingerprint !== lastPresentationResultsCount;

  sharedState.forEach((value, key)=>{
    if(typeof key !== 'string' || !key.startsWith('rxn:')) return;
    const ts = parseInt(key.slice(4));
    if(!isNaN(ts) && ts > presentationStartTime && !lastReactionKeys.has(key)){
      lastReactionKeys.add(key);
      try{ const r = typeof value === 'string' ? JSON.parse(value) : value; if(r && r.emoji) spawnReactionOverlay(r.emoji); }catch(e){}
    }
  });

  if(!stateChanged && !resultsChanged && !qrChanged) return;

  current = newCurrent;
  phase = newPhase;

  if(stateChanged){
    lastPresentationPhase = newPhase;
    lastPresentationCurrent = newCurrent;
    lastPresentationResultsCount = resultsFingerprint;
    lastPresentationQr = sharedState.get('qrCodeDataUrl') || '';
    qrCodeDataUrl = lastPresentationQr;
    if(phase === PHASE_LOBBY){
      renderPresentationLobby();
      return;
    }
    if(phase === PHASE_FINAL){
      renderPresentationView(current, true);
      return;
    }
    renderPresentationView(current);
    return;
  }

  // Only results changed — update ticker and word cloud without full re-render
  lastPresentationResultsCount = resultsFingerprint;
  lastPresentationQr = sharedState.get('qrCodeDataUrl') || '';
  qrCodeDataUrl = lastPresentationQr;
  const tickerPanel = document.getElementById('tickerPanel');
  if(tickerPanel) tickerPanel.innerHTML = renderResponseTickerHtml(current);
  updateSyncedQuestionStatsUI();
  checkMilestones();
  renderWordCloud(current);
}
function hasActivePresentation(){
  if(!sharedState) return false;
  const token = sharedState.get('presentationToken');
  const heartbeat = sharedState.get('presentationHeartbeat') || 0;
  return !!token && (Date.now() - heartbeat) < 10000;
}
function dynamicImportCompat(url){
  return (new Function('u', 'return import(u)'))(url);
}
async function loadRealtimeLibs(){
  if(firebaseFns && firebaseDb) return true;
  try{
    const appMod = await dynamicImportCompat('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
    const dbMod = await dynamicImportCompat('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');
    const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(FIREBASE_CONFIG);
    firebaseApp = app;
    firebaseDb = dbMod.getDatabase(firebaseApp);
    firebaseFns = {
      ref: dbMod.ref,
      child: dbMod.child,
      set: dbMod.set,
      get: dbMod.get,
      onValue: dbMod.onValue,
      remove: dbMod.remove,
      update: dbMod.update,
      runTransaction: dbMod.runTransaction,
      onDisconnect: dbMod.onDisconnect
    };
    return true;
  }catch(err){
    console.error(err);
    realtimeEnabled = false;
    return false;
  }
}
async function initRealtime(){
  if(!(await loadRealtimeLibs())) return false;
  destroyRealtime();

  sharedState = createFirebaseSharedState();
  firebaseSessionRoot = firebaseFns.ref(firebaseDb, `sessions/${PUBLIC_ROOM_ID}`);
  firebaseStateRef = firebaseFns.child(firebaseSessionRoot, 'state');
  firebaseResultsRef = firebaseFns.child(firebaseSessionRoot, 'results');

  const initialSync = new Promise(resolve => {
    let stateReady = false, resultsReady = false;
    const check = () => { if(stateReady && resultsReady) resolve(); };
    firebaseStateUnsub = firebaseFns.onValue(firebaseStateRef, snap => {
      sharedState.replaceState(snap.val() || {});
      if(!stateReady){ stateReady = true; check(); }
    });
    firebaseResultsUnsub = firebaseFns.onValue(firebaseResultsRef, snap => {
      sharedState.replaceResults(snap.val() || {});
      if(!resultsReady){ resultsReady = true; check(); }
    });
    setTimeout(resolve, 4000); /* safety timeout */
  });
  await initialSync;

  if(sessionMode === 'presentation'){
    presentationToken = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const tokenRef = firebaseFns.child(firebaseStateRef, 'presentationToken');
    try {
      const result = await firebaseFns.runTransaction(tokenRef, (currentToken) => {
        const hb = sharedState.get('presentationHeartbeat') || 0;
        if(currentToken && (Date.now() - hb) < 10000){
          return;
        }
        return presentationToken;
      });
      if(!result.committed){
        alert('Presentation view is already active on another screen.');
        presentationToken = '';
        destroyRealtime();
        return false;
      }
    } catch(e){
      console.error('Presentation transaction failed:', e);
      alert('Could not claim presentation view. Try again.');
      presentationToken = '';
      destroyRealtime();
      return false;
    }
    // Sync token into local state immediately so hasActivePresentation() returns true
    sharedState.set('presentationToken', presentationToken);
    presentationStartTime = Date.now();
    lastReactionKeys = new Set();
    // Reset room for new session now that we hold the token
    await firebaseFns.remove(firebaseResultsRef).catch(e => console.error('Firebase reset error:', e));
    sharedState.replaceResults({});
    sharedState.set('presentationName', nameVal);
    sharedState.set('presentationHeartbeat', Date.now());
    sharedState.set('phase', PHASE_LOBBY);
    sharedState.set('ended', false);
    sharedState.set('current', 0);
    if(firebaseFns.onDisconnect){
      firebaseFns.onDisconnect(firebaseFns.child(firebaseStateRef,'presentationToken')).remove().catch(()=>{});
      firebaseFns.onDisconnect(firebaseFns.child(firebaseStateRef,'presentationHeartbeat')).set(0).catch(()=>{});
    }
    presentationHeartbeatTimer = setInterval(()=>{
      if(sharedState && sharedState.get('presentationToken') === presentationToken){
        sharedState.set('presentationHeartbeat', Date.now());
      }
    }, 2500);
    sharedStateObserverUnsub = sharedState.observe(()=>{
      if(sessionMode !== 'presentation') return;
      applyPresentationState();
    });
  } else {
    sharedStateObserverUnsub = sharedState.observe(()=>{
      applyParticipantState();
      if(isQuestionPhase()){
        updateHeader();
        updateSyncedQuestionStatsUI();
      }
    });
  }
  realtimeTransport = 'firebase';
  return true;
}
async function forceResetAll(){
  if(sessionMode !== 'presentation'){
    alert('Only the presentation host can run Force Reset.');
    return;
  }
  if(!confirm('Clear all session data and Firebase room state?\nThis resets scores, results, and tokens for everyone in this room.')) return;
  destroyRealtime();
  clearSessionState();
  sessionMode = 'participant';
  phase = PHASE_ROUND1;
  current = 0; score = 0; answered = [];
  participantFeedback = {};
  nameVal = ''; aliasVal = '';
  anonymousJoin = false;
  lastRemoteCurrent = -1;
  lastRemoteEnded = false;
  lastRemotePhase = '';
  lastPresentationCurrent = -1;
  lastPresentationPhase = '';
  lastPresentationResultsCount = -1;
  lastPresentationQr = '';
  qrCodeDataUrl = '';
  qrCodeFileName = '';
  try{
    if(await loadRealtimeLibs()){
      const sessionRef = firebaseFns.ref(firebaseDb, `sessions/${PUBLIC_ROOM_ID}`);
      const stateRef = firebaseFns.child(sessionRef, 'state');
      const resultsRef = firebaseFns.child(sessionRef, 'results');
      await firebaseFns.update(stateRef, {
        presentationToken: null, presentationHeartbeat: 0, presentationName: null,
        phase: PHASE_LOBBY, ended: false, current: 0, qrCodeDataUrl: null
      }).catch(e => console.error('Reset state error:', e));
      await firebaseFns.remove(resultsRef).catch(e => console.error('Reset results error:', e));
    }
  }catch(e){ console.error('Force reset Firebase error:', e); }
  renderLanding();
  updateHeader();
}

async function startHostQuestions(){
  if(sessionMode !== 'presentation' || !sharedState) return;
  if(!qrCodeDataUrl){
    alert('Upload a QR code before starting the game.');
    return;
  }
  milestoneShown = new Set();
  phase = PHASE_ROUND1;
  current = 0;
  await firebaseFns.remove(firebaseResultsRef).catch(e => console.error('Firebase reset error:', e));
  sharedState.replaceResults({});
  sharedState.set('qrCodeDataUrl', qrCodeDataUrl);
  pushHostState(false);
  renderPresentationView(current);
}
function renderQuestion(i){
  stopLandingStatusWatch();
  setPresentationShell(false);
  const q = QUESTIONS[i];
  const prevAnswers = Array.isArray(answered[i]) ? answered[i] : [];
  const hasSubmitted = prevAnswers.length > 0;
  const hasHost = hasActivePresentation();
  const waitingForHost = sessionMode === 'participant' && !hasHost;
  const isFollowingHost = sessionMode === 'participant' && realtimeEnabled && hasHost;
  const showSyncedStats = shouldShowSyncedQuestionStats();
  const syncedStatsText = syncedQuestionStatsLabel(i);
  const prevAnswersHtml = hasSubmitted
    ? `<div class="answer-fact-card small" style="line-height:1.6;margin-top:10px">
        <div style="font-weight:700;margin-bottom:4px">Your responses (${prevAnswers.length}):</div>
        <ol style="margin:0;padding-left:18px">${prevAnswers.map(a => `<li><em>${a}</em></li>`).join('')}</ol>
      </div>`
    : '';
  screen.innerHTML = `
    <div>
      <div class="qtext">${q.text}</div>
      ${prevAnswersHtml}
      <p class="small" style="margin-top:8px;color:#6a1b9a;font-weight:600">You can respond as many times as you like — each response adds to the word cloud.</p>
      <textarea id="responseIn" placeholder="Type a response and hit Submit…" rows="3" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:1rem;resize:vertical;margin-top:6px;box-sizing:border-box" ${waitingForHost?'disabled':''}></textarea>
      ${waitingForHost
          ? `<div class="controls">
              <button onclick="submitParticipantAnswer()" disabled>Submit</button>
              <span class="small" style="align-self:center"><strong>Waiting for host…</strong> You will sync automatically once Presentation View starts.</span>
            </div>
            <div id="syncedQuestionStats" class="synced-score-callout" style="display:none"></div>`
        : isFollowingHost
          ? `<div class="controls">
              <button onclick="submitParticipantAnswer()">Submit</button>
              <span class="small" style="align-self:center">The host will advance to the next question.</span>
            </div>
            <div id="syncedQuestionStats" class="synced-score-callout" style="display:${showSyncedStats?'block':'none'}">${syncedStatsText}</div>
            <div class="reaction-bar"><span class="small" style="color:#888;font-size:.8rem;margin-right:2px">React:</span><button class="rxn-btn" onclick="sendReaction('👍')">👍</button><button class="rxn-btn" onclick="sendReaction('🔥')">🔥</button><button class="rxn-btn" onclick="sendReaction('💡')">💡</button><button class="rxn-btn" onclick="sendReaction('❤️')">❤️</button><button class="rxn-btn" onclick="sendReaction('🎉')">🎉</button></div>`
          : `<div class="controls">
              <button class="secondary" onclick="prev()" ${i===0?'disabled':''}>Back</button>
              <button onclick="submitParticipantAnswer()">Submit</button>
              <button onclick="next()">${i===total-1?'Finish':'Next'}</button>
            </div>
            <div id="syncedQuestionStats" class="synced-score-callout" style="display:${showSyncedStats?'block':'none'}">${syncedStatsText}</div>
            <p class="small" style="margin-top:8px">Offline mode: submit each answer, then use Next to continue.</p>`
      }
      <div class="small" style="margin-top:14px;color:#999;font-size:.78rem;text-align:right"><strong>${nameVal}</strong> &nbsp;·&nbsp; ${modeText()}</div>
    </div>`;
  updateSyncedQuestionStatsUI();
  updateHeader();
  saveSessionState();
}
function recalcScore(){
  score = answered.filter(a => Array.isArray(a) ? a.length > 0 : a != null).length;
}
function saveAnswer(){
  // Not used in survey mode — offline answer capture handled by submitParticipantAnswer
  return false;
}
function submitParticipantAnswer(){
  if(sessionMode !== 'participant' || !isQuestionPhase()) return;
  if(!sharedState){
    alert('Not connected to the session. Please go back and rejoin.');
    return;
  }
  const textarea = document.getElementById('responseIn');
  const val = textarea ? textarea.value.trim() : '';
  if(!val){ alert('Please type a response before submitting.'); return; }
  if(!Array.isArray(answered[current])) answered[current] = [];
  answered[current].push(val);
  recalcScore();
  publishMyTally();
  renderQuestion(current);
}
function next(){
  if(sessionMode === 'participant') return;
  if(current < ROUND1_COUNT-1){
    current++;
    renderPresentationView(current);
    pushHostState(false);
    return;
  }
  phase = PHASE_FINAL;
  renderPresentationView(current, true);
  pushHostState(true);
  setTimeout(()=>{ exportAllWordCloudsPdf(); }, 800);
}
function prev(){
  if(sessionMode === 'participant') return;
  if(current > 0){
    current--;
    phase = PHASE_ROUND1;
    renderPresentationView(current);
    pushHostState(false);
  }
}
function renderEnd(){
  stopLandingStatusWatch();
  setPresentationShell(sessionMode === 'presentation');
  phase = PHASE_FINAL;
  if(sessionMode === 'participant'){
    recalcScore();
    publishMyTally();
  }
  screen.innerHTML = `
    <div class="center">
      ${sessionMode==='participant'
        ? `<h3>Thank you for your responses!</h3><p class="small">You responded to ${score} of ${total} question${total===1?'':'s'}. Your input will help build the word cloud.</p>`
        : `<h3>Survey Complete</h3><p class="small">Host display complete. Use Force Reset in Presentation View to begin a new run.</p>`}
      ${sessionMode==='presentation' ? '' : `<div class="controls" style="justify-content:center"><button class="secondary" onclick="retake()">Restart</button></div>`}
      <div style="margin-top:12px;text-align:left">
        <div class="small" style="font-weight:600">Response Summary</div>
        ${renderTalliesHtml()}
      </div>
      <details style="margin-top:10px"><summary class="small">Review your responses</summary>
        <ol class="small" style="text-align:left;margin-top:8px">
          ${QUESTIONS.map((q,i)=> {
            const picks = Array.isArray(answered[i]) ? answered[i] : (answered[i] ? [answered[i]] : []);
            return `<li><strong>Q${i+1}:</strong> ${q.text}<div>${picks.length > 0 ? picks.map(p => `<em>${p}</em>`).join('<br>') : '<em>(not answered)</em>'}</div></li>`;
          }).join('')}
        </ol>
      </details>
    </div>`;
  updateHeader();
  saveSessionState();
}
function copyResults(){
  const summary = {
    name:nameVal, alias:aliasVal, responded: score, total,
    answers: QUESTIONS.map((q,i)=>({ q:i+1, responses: Array.isArray(answered[i]) ? answered[i] : (answered[i] ? [answered[i]] : []) }))
  };
  const text = JSON.stringify(summary,null,2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("Results copied. Paste into the organizer's form."),
                                            ()=>alert('Copy failed. Select and copy manually:\n'+text));
    return;
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){
      alert("Results copied. Paste into the organizer's form.");
      return;
    }
  }catch(_err){}
  alert('Copy failed. Select and copy manually:\n'+text);
}
function retake(){
  destroyRealtime();
  clearSessionState();
  sessionMode = 'participant';
  phase = PHASE_ROUND1;
  current=-1; score=0; answered=[];
  participantFeedback = {};
  anonymousJoin = false;
  lastRemoteCurrent = -1;
  lastRemoteEnded = false;
  lastRemotePhase = '';
  lastPresentationCurrent = -1;
  lastPresentationPhase = '';
  lastPresentationResultsCount = -1;
  lastPresentationQr = '';
  qrCodeDataUrl = '';
  qrCodeFileName = '';
  renderLanding();
  updateHeader();
}
async function startQuiz(mode = 'participant'){
  const selectedMode = mode === 'presentation' ? 'presentation' : 'participant';
  const nameInput = document.getElementById('nameIn');
  const n = nameInput ? nameInput.value.trim() : '';
  participantId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  nameVal = selectedMode === 'participant'
    ? (n || 'Anonymous')
    : 'Presentation Screen';
  aliasVal = '';
  sessionMode = selectedMode;
  phase = selectedMode === 'presentation' ? PHASE_LOBBY : PHASE_ROUND1;
  score = 0;
  answered = [];
  participantFeedback = {};
  anonymousJoin = false;
  lastRemoteCurrent = -1;
  lastRemoteEnded = false;
  lastRemotePhase = '';
  lastPresentationCurrent = -1;
  lastPresentationPhase = '';
  lastPresentationResultsCount = -1;
  lastPresentationQr = '';

  if(sessionMode === 'presentation'){
    current = 0;
    qrCodeDataUrl = '';
    qrCodeFileName = '';
    realtimeEnabled = await initRealtime();
    if(!realtimeEnabled){
      alert('Presentation View could not start because live sync is unavailable. Check internet or firewall access to Firebase, then try again.');
      sessionMode = 'participant';
      renderLanding();
      return;
    }
    renderPresentationLobby();
    return;
  }

  current = 0;
  realtimeEnabled = await initRealtime();
  renderParticipantLobby();
  saveSessionState();
  if(realtimeEnabled && sharedState){
    lastRemoteCurrent = -1;
    lastRemoteEnded = sharedState.get('ended') === true;
    lastRemotePhase = '';
    lastPresentationCurrent = -1;
    lastPresentationPhase = '';
    lastPresentationResultsCount = -1;
    lastPresentationQr = sharedState.get('qrCodeDataUrl') || '';
    qrCodeDataUrl = lastPresentationQr;
    applyParticipantState();
  }
}
/* Cleanup tokens if tab/window is closed */
window.addEventListener('beforeunload', () => { destroyRealtime(); });
/* init */
renderLanding(); updateHeader();
if(restoreSessionState()){
  resumeRealtimeAfterRestore().catch(e => console.error('Realtime restore failed:', e));
}
</script>
